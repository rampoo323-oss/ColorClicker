name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Arrange project
        run: |
          B=app/src/main
          mkdir -p $B/java/com/example/colorclicker $B/res/xml
          mv AndroidManifest.xml $B/
          mv *.kt $B/java/com/example/colorclicker/
          mv accessibility_config.xml $B/res/xml/
          mv app-build.gradle.kts app/build.gradle.kts
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ColorClicker-apk
          path: app/build/outputs/apk/debug/app-debug.apk
