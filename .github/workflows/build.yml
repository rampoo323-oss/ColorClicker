name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Arrange project
        run: |
          B=app/src/main
          mkdir -p $B/java/com/example/colorclicker $B/res/xml $B/res/values
          echo '<resources><string name="svc_desc">Tap service for Color Clicker</string></resources>' > $B/res/values/strings.xml
          sed -i 's|android:description="[^"]*"|android:description="@string/svc_desc"|' accessibility_config.xml
          sed -i 's/catch (_: Exception)/catch (e: Exception)/g' OverlayService.kt
          mv AndroidManifest.xml $B/
          mv *.kt $B/java/com/example/colorclicker/
          mv accessibility_config.xml $B/res/xml/
          mv app-build.gradle.kts app/build.gradle.kts
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build
        run: |
          set +e
          gradle assembleDebug --no-daemon --console=plain > build.log 2>&1
          code=$?
          {
            echo '### Build errors'
            echo '```'
            grep -E -A6 "^e: |What went wrong" build.log | head -40
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          tail -n 40 build.log
          exit $code
      - uses: actions/upload-artifact@v4
        with:
          name: ColorClicker-apk
          path: app/build/outputs/apk/debug/app-debug.apk
